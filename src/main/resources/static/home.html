<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CofounderLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topnav">
    <div class="wrap">
        <a class="brand" href="#home">
            <span class="brand-mark">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="16.5" cy="9.5" r="2.8"/><path d="M3 20c.7-3.6 3.2-5.5 6-5.5s5.3 1.9 6 5.5M15 14.6c2.6-.3 5 1.3 5.8 4.4"/></svg>
            </span>
            <span class="brand-name">CofounderLab<small>Bucheon University</small></span>
        </a>
        <nav class="tabs-nav" id="tabsNav">
            <a href="#home" data-view="home" data-i18n-title="nav.home" data-i18n-aria="nav.home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
                <span data-i18n="nav.home"></span>
            </a>
            <a href="#my" data-view="my" data-i18n-title="nav.my" data-i18n-aria="nav.my">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
                <span data-i18n="nav.my"></span>
            </a>
            <a href="#profile" data-view="profile" data-i18n-title="nav.profile" data-i18n-aria="nav.profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
                <span data-i18n="nav.profile"></span>
            </a>
        </nav>
        <div class="me">
            <div class="lang-switch"></div>
            <button class="btn btn-sun nav-create" data-action="create" data-i18n-title="nav.newAd">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                <span data-i18n="nav.newAd"></span>
            </button>
            <a class="avatar" id="meAvatar" href="#profile" data-i18n-title="nav.profile"></a>
        </div>
    </div>
</header>

<main class="wrap">
    <!-- Home: all ads grouped by category -->
    <section data-page="home">
        <div class="board-head">
            <div>
                <h1 id="greeting" data-i18n="home.title"></h1>
                <p data-i18n="home.lead"></p>
            </div>
            <div class="head-meme" data-meme="home"></div>
        </div>

        <div class="toolbar">
            <label class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="search" type="search" data-i18n-placeholder="home.search" data-i18n-aria="home.search">
            </label>
            <label class="toggle"><input type="checkbox" id="hidePast" checked> <span data-i18n="home.hidePast"></span></label>
        </div>

        <nav class="cats" id="cats" data-i18n-aria="cat.categories"></nav>
        <div id="feed" aria-live="polite">
            <div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
    </section>

    <!-- My ads -->
    <section data-page="my" hidden>
        <div class="board-head">
            <div>
                <h1 data-i18n="nav.my"></h1>
                <p data-i18n="my.lead"></p>
            </div>
            <div class="head-meme" data-meme="my"></div>
        </div>
        <div id="myFeed"></div>
    </section>

    <!-- Profile -->
    <section data-page="profile" hidden>
        <div class="profile">
            <aside class="profile-card">
                <div class="profile-cover"></div>
                <span class="avatar avatar-lg" id="profileAvatar"></span>
                <h2 id="profileName"></h2>
                <p class="muted" id="profileMeta"></p>
                <div class="profile-meme" data-meme="profile"></div>
                <div class="profile-stats" id="profileStats"></div>
                <div class="form-meme bye-meme" data-meme="bye"></div>
                <button class="btn btn-line btn-block" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
                    <span data-i18n="profile.logout"></span>
                </button>
            </aside>

            <div class="panel">
                <h2 data-i18n="profile.details"></h2>
                <p class="muted" data-i18n="profile.detailsSub"></p>
                <form class="form" id="profileForm" novalidate>
                    <div class="field"><label for="pLogin" data-i18n="f.login"></label><input id="pLogin" disabled></div>
                    <div class="row">
                        <div class="field"><label for="pName" data-i18n="f.name"></label><input id="pName" name="name" required maxlength="30" autocomplete="given-name"></div>
                        <div class="field"><label for="pSurname" data-i18n="f.surname"></label><input id="pSurname" name="surname" required maxlength="30" autocomplete="family-name"></div>
                    </div>
                    <div class="row">
                        <div class="field"><label for="pDepartment" data-i18n="f.department"></label><input id="pDepartment" name="department" required maxlength="50"></div>
                        <div class="field">
                            <label for="pYear" data-i18n="f.year"></label>
                            <select id="pYear" name="year" data-year-select>
                                <option value="1"></option>
                                <option value="2"></option>
                                <option value="3"></option>
                                <option value="4"></option>
                            </select>
                        </div>
                    </div>
                    <div class="field" data-contact-field><label for="pContact" data-i18n="f.contact"></label><input id="pContact" name="contact" required></div>
                    <div class="alert" id="profileError" hidden></div>
                    <div class="modal-actions"><button class="btn btn-sun" type="submit" id="profileSave" data-i18n="profile.save"></button></div>
                </form>
                <section class="meme-day" data-meme-day></section>
            </div>
        </div>
    </section>
</main>

<button class="fab" data-action="create" data-i18n-aria="nav.newAd">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Create / edit -->
<dialog id="editDialog">
    <div class="modal-head">
        <h2 id="editTitle"></h2>
        <button class="icon-btn" data-close data-i18n-aria="close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
    </div>
    <form class="modal-body form" id="editForm" novalidate>
        <div class="form-meme" data-meme="newAd"></div>
        <div class="field">
            <label data-i18n="edit.category"></label>
            <div class="cat-picker" id="catPicker"></div>
        </div>
        <div class="field">
            <label for="description" data-i18n="edit.desc"></label>
            <textarea id="description" name="description" maxlength="200" required data-i18n-placeholder="edit.descPh"></textarea>
            <span class="counter" id="counter">0 / 200</span>
        </div>
        <div class="row">
            <div class="field"><label for="deadline" data-i18n="edit.deadline"></label><input id="deadline" name="deadline" type="date"></div>
            <div class="field" data-contact-field><label for="studentContact" data-i18n="f.contactShort"></label><input id="studentContact" name="studentContact" required></div>
        </div>
        <div class="alert" id="editError" hidden></div>
        <div class="modal-actions">
            <button type="button" class="btn btn-line" data-close data-i18n="edit.cancel"></button>
            <button type="submit" class="btn btn-sun" id="saveBtn"></button>
        </div>
    </form>
</dialog>

<!-- Details -->
<dialog id="viewDialog">
    <div class="detail-hero" id="viewHero"></div>
    <div class="modal-body">
        <p class="detail-desc" id="viewDesc"></p>
        <div class="facts" id="viewFacts"></div>
        <div class="view-meme" id="viewMeme"></div>
        <div class="modal-actions" id="viewActions"></div>
    </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="/js/i18n.js"></script>
<script src="/js/cats.js"></script>
<script src="/js/validate.js"></script>
<script src="/js/api.js"></script>
<script>
    if (!getToken()) location.replace("/");

    const state = {
        me: null,
        ads: [],
        students: new Map(),
        category: "ALL",
        query: "",
        hidePast: true,
        editingId: null,
        viewingId: null
    };

    const editDialog = document.getElementById("editDialog");
    const viewDialog = document.getElementById("viewDialog");

    // ---------- Loading ----------
    async function load() {
        try {
            const [me, ads, students] = await Promise.all([
                api("/api/auth/me"), api("/api/ads"), api("/api/students")
            ]);
            state.me = me;
            state.ads = ads;
            state.students = new Map(students.map(s => [s.id, s]));
            renderAll();
        } catch (e) {
            if (e.status === 401) return logout();
            document.getElementById("feed").innerHTML = `<div class="empty">${memeHtml("broken", "empty-meme")}<h3>${t("home.loadError")}</h3><p>${escapeHtml(e.message)}</p></div>`;
        }
    }

    function logout() {
        clearToken();
        location.replace("/");
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);

    function renderAll() {
        document.getElementById("meAvatar").textContent = initials(state.me);
        document.getElementById("greeting").textContent = t("home.hi", { name: state.me.name });
        renderHome();
        renderMy();
        renderProfile();
    }

    // ---------- Routing ----------
    function showView() {
        const view = ["home", "my", "profile"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
        document.querySelectorAll("[data-page]").forEach(page => page.hidden = page.dataset.page !== view);
        document.querySelectorAll("#tabsNav a").forEach(a => a.classList.toggle("active", a.dataset.view === view));
        window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", showView);
    showView();

    // ---------- Home: grouped by category ----------
    function isPast(ad) {
        const info = deadlineInfo(ad.deadline);
        return ad.status === "CLOSED" || Boolean(info && info.past);
    }

    function categoryOf(ad) {
        return CATEGORIES[ad.title] ? ad.title : "OTHER";
    }

    function sortAds(ads) {
        return ads.slice().sort((a, b) => (isPast(a) - isPast(b)) || (b.id - a.id));
    }

    function authorName(author) {
        return author ? author.name + " " + author.surname : t("card.student");
    }

    function matchesSearch(ad) {
        if (state.hidePast && isPast(ad)) return false;
        if (!state.query) return true;
        const author = state.students.get(ad.studentId) || {};
        const haystack = [ad.description, ad.studentContact, author.name, author.surname, author.department,
            catLabel(categoryOf(ad))].join(" ").toLowerCase();
        return haystack.includes(state.query);
    }

    // Last markup written to each list, so clicks that change nothing don't rebuild it (and re-show the memes)
    const lastHtml = new Map();
    function setHtml(el, html) {
        if (lastHtml.get(el) === html) return;
        lastHtml.set(el, html);
        el.innerHTML = html;
    }

    function renderHome() {
        const base = state.ads.filter(matchesSearch);
        const keys = Object.keys(CATEGORIES);

        const chips = [{ key: "ALL", label: t("cat.all"), count: base.length }]
            .concat(keys.map(key => ({ key, label: catLabel(key), count: base.filter(ad => categoryOf(ad) === key).length })));
        document.getElementById("cats").innerHTML = chips.map(chip => `
            <button class="cat ${state.category === chip.key ? "active" : ""}" data-cat="${chip.key}"
                    style="${chip.key !== "ALL" ? `--c: var(--cat-${chip.key})` : ""}">
                ${chip.key === "ALL"
                    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'
                    : categoryIcon(chip.key)}
                ${chip.label}<span class="count">${chip.count}</span>
            </button>`).join("");

        const feed = document.getElementById("feed");
        const shownKeys = state.category === "ALL" ? keys : [state.category];
        const sections = shownKeys
            .map(key => ({ key, ads: sortAds(base.filter(ad => categoryOf(ad) === key)) }))
            .filter(group => group.ads.length);

        if (!sections.length) {
            if (state.query) {
                setHtml(feed, emptyHtml(t("empty.noResults"), t("empty.tryOther"), "noResults"));
                return;
            }
            const title = state.category === "ALL" ? t("empty.none") : t("empty.noneIn", { cat: catLabel(state.category) });
            setHtml(feed, emptyHtml(title, t("empty.first")));
            return;
        }
        setHtml(feed, sections.map(group => `
            <section class="cat-section" style="--c: var(--cat-${group.key})">
                <header class="cat-head">
                    <span class="cat-badge">${categoryIcon(group.key, 20)}</span>
                    <div><h2>${catLabel(group.key)}</h2><p>${catHint(group.key)}</p></div>
                    <span class="cat-total">${group.ads.length}</span>
                </header>
                <div class="grid">${group.ads.map(cardHtml).join("")}</div>
            </section>`).join(""));
    }

    function emptyHtml(title, text, memeSlot = "empty") {
        return `
            <div class="empty">
                ${memeHtml(memeSlot, "empty-meme")}
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(text)}</p>
                <button class="btn btn-sun" style="margin-top:1.2rem" data-action="create">${t("empty.post")}</button>
            </div>`;
    }

    function cardHtml(ad) {
        const key = categoryOf(ad);
        const author = state.students.get(ad.studentId);
        const dl = deadlineInfo(ad.deadline);
        return `
            <article class="card ${isPast(ad) ? "is-past" : ""}" tabindex="0" data-id="${ad.id}" style="--c: var(--cat-${key})">
                <div class="card-top">
                    <span class="tag">${categoryIcon(key, 14)} ${catLabel(key)}</span>
                    ${ad.studentId === state.me.id ? `<span class="mine">${t("card.yours")}</span>` : ""}
                </div>
                <p class="desc">${escapeHtml(ad.description)}</p>
                <div class="card-foot">
                    <div class="author">
                        <span class="avatar">${escapeHtml(initials(author))}</span>
                        <div>${escapeHtml(authorName(author))}
                            <small>${author ? escapeHtml(author.department) : ""}</small></div>
                    </div>
                    ${dl ? `<span class="deadline ${dl.urgent ? "urgent" : ""} ${dl.past ? "past" : ""}">${dl.text}</span>` : ""}
                </div>
            </article>`;
    }

    document.getElementById("cats").addEventListener("click", event => {
        const chip = event.target.closest(".cat");
        if (!chip) return;
        state.category = chip.dataset.cat;
        renderHome();
    });
    document.getElementById("search").addEventListener("input", event => {
        state.query = event.target.value.trim().toLowerCase();
        renderHome();
    });
    document.getElementById("hidePast").addEventListener("change", event => {
        state.hidePast = event.target.checked;
        renderHome();
    });

    // ---------- My ads ----------
    function myAds() {
        return state.ads.filter(ad => ad.studentId === state.me.id);
    }

    function renderMy() {
        const mine = sortAds(myAds());
        setHtml(document.getElementById("myFeed"), mine.length
            ? `<div class="grid">
                   <button class="card card-new" data-action="create">
                       <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                       ${t("my.new")}
                   </button>
                   ${mine.map(cardHtml).join("")}
               </div>`
            : emptyHtml(t("my.emptyTitle"), t("my.emptyText"), "myEmpty"));
    }

    // ---------- Profile ----------
    function renderProfile() {
        const me = state.me;
        const mine = myAds();
        document.getElementById("profileAvatar").textContent = initials(me);
        document.getElementById("profileName").textContent = me.name + " " + me.surname;
        document.getElementById("profileMeta").textContent = "@" + (me.login || "") + " · " + me.department + " · " + yearLabel(me.year);
        document.getElementById("profileStats").innerHTML = `
            <div><b>${mine.length}</b><small>${t("profile.ads")}</small></div>
            <div><b>${mine.filter(ad => !isPast(ad)).length}</b><small>${t("profile.active")}</small></div>`;

        document.getElementById("pLogin").value = me.login || "";
        document.getElementById("pName").value = me.name || "";
        document.getElementById("pSurname").value = me.surname || "";
        document.getElementById("pDepartment").value = me.department || "";
        document.getElementById("pYear").value = String(me.year || 1);
        setContactValue(profileForm, "contact", me.contact);
    }

    const profileForm = document.getElementById("profileForm");
    const profileRules = {
        name: RULES.personName,
        surname: RULES.personName,
        department: RULES.department,
        year: RULES.year,
        contact: contactRule(profileForm, "contact")
    };
    attachLiveValidation(profileForm, () => profileRules);

    profileForm.addEventListener("submit", async event => {
        event.preventDefault();
        const errorBox = document.getElementById("profileError");
        errorBox.hidden = true;
        if (!validateFields(profileForm, profileRules)) return;
        const data = Object.fromEntries(new FormData(profileForm));
        const saveBtn = document.getElementById("profileSave");
        saveBtn.disabled = true;
        try {
            const updated = await api("/api/students/" + state.me.id, {
                method: "PUT",
                body: {
                    name: data.name.trim(),
                    surname: data.surname.trim(),
                    department: data.department.trim(),
                    year: Number(data.year),
                    contact: contactValue(profileForm, "contact")
                }
            });
            state.me = updated;
            state.students.set(updated.id, updated);
            clearFieldErrors(profileForm);
            renderAll();
            toast(t("profile.saved"), "saved");
        } catch (e) {
            if (e.status === 401) return logout();
            errorBox.textContent = e.message;
            errorBox.hidden = false;
        } finally {
            saveBtn.disabled = false;
        }
    });

    // ---------- Card clicks ----------
    document.querySelector("main").addEventListener("click", event => {
        const card = event.target.closest(".card[data-id]");
        if (card) openView(Number(card.dataset.id));
    });
    document.querySelector("main").addEventListener("keydown", event => {
        const card = event.target.closest(".card[data-id]");
        if (card && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            openView(Number(card.dataset.id));
        }
    });

    // ---------- View ----------
    function openView(id) {
        const ad = state.ads.find(a => a.id === id);
        if (!ad) return;
        state.viewingId = id;
        const key = categoryOf(ad);
        const author = state.students.get(ad.studentId);
        const dl = deadlineInfo(ad.deadline);
        const mine = ad.studentId === state.me.id;

        const hero = document.getElementById("viewHero");
        hero.style.setProperty("--c", `var(--cat-${key})`);
        hero.innerHTML = `
            <svg class="bg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${CATEGORIES[key].icon}</svg>
            <button class="icon-btn close" data-close aria-label="${t("close")}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <span class="tag">${categoryIcon(key, 14)} ${catLabel(key)}</span>
            <h2>${mine ? t("view.yours") : escapeHtml(t("view.looking", { name: authorName(author) }))}</h2>`;

        document.getElementById("viewDesc").textContent = ad.description || "";
        document.getElementById("viewFacts").innerHTML = `
            <div class="fact fact-author"><small>${t("view.author")}</small>
                <b><span class="avatar">${escapeHtml(initials(author))}</span>${escapeHtml(authorName(author))}</b></div>
            <div class="fact"><small>${t("f.contactShort")}</small><b>${contactLink(ad.studentContact)}</b></div>
            <div class="fact"><small>${t("edit.deadline")}</small><b>${escapeHtml(dl ? dl.text : t("view.noDeadline"))}</b></div>
            <div class="fact"><small>${t("f.department")}</small><b>${author ? escapeHtml(author.department) : "—"}</b></div>
            <div class="fact"><small>${t("f.year")}</small><b>${author ? yearLabel(author.year) : "—"}</b></div>`;

        // A deadline that is close gets "This is fine", otherwise others' ads nudge you to write the author
        const urgent = dl && dl.urgent && !dl.past;
        document.getElementById("viewMeme").innerHTML = urgent
            ? memeHtml("fine", "view-fine")
            : (mine ? "" : memeHtml("writeThem", "meme-row"));
        document.getElementById("viewActions").innerHTML = mine
            ? `<button class="btn btn-danger" data-delete="${ad.id}">${t("view.delete")}</button>
               <button class="btn btn-sun" data-edit="${ad.id}">${t("view.edit")}</button>`
            : respondButton(ad, author)
              + `<button class="btn btn-line" data-copy="${escapeHtml(ad.studentContact || "")}">${t("view.copy")}</button>`;
        if (!viewDialog.open) viewDialog.showModal();
    }

    // "Respond" opens a Telegram chat with the author, or an email with a ready-made reply
    function respondButton(ad, author) {
        const contact = ad.studentContact || "";
        let href;
        if (contactTypeOf(contact) === "email") {
            const subject = t("mail.subject", { cat: catLabel(categoryOf(ad)) });
            const body = t("mail.body", {
                name: author ? author.name : "",
                me: state.me.name + " " + state.me.surname,
                dept: state.me.department,
                year: yearLabel(state.me.year)
            });
            href = `mailto:${contact}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        } else if (/^@[a-zA-Z][a-zA-Z0-9_]{4,31}$/.test(contact)) {
            href = "https://t.me/" + contact.slice(1);
        } else {
            return "";
        }
        return `<a class="btn btn-sun" href="${escapeHtml(href)}" target="_blank" rel="noopener">${t("view.respond")}</a>`;
    }

    viewDialog.addEventListener("click", async event => {
        if (event.target === viewDialog) return viewDialog.close();
        const target = event.target.closest("button");
        if (!target) return;

        if (target.dataset.edit) {
            viewDialog.close();
            openEdit(state.ads.find(a => a.id === Number(target.dataset.edit)));
        } else if (target.dataset.delete) {
            // Ask inside the dialog, with the "stop" meme, instead of the browser's confirm()
            document.getElementById("viewMeme").innerHTML = memeHtml("deleteConfirm", "meme-row");
            document.getElementById("viewActions").innerHTML = `
                <button class="btn btn-line" data-cancel-delete="${target.dataset.delete}">${t("edit.cancel")}</button>
                <button class="btn btn-danger" data-confirm-delete="${target.dataset.delete}">${t("view.deleteYes")}</button>`;
        } else if (target.dataset.cancelDelete) {
            openView(Number(target.dataset.cancelDelete));
        } else if (target.dataset.confirmDelete) {
            try {
                await api("/api/ads/" + target.dataset.confirmDelete, { method: "DELETE" });
                state.ads = state.ads.filter(a => a.id !== Number(target.dataset.confirmDelete));
                viewDialog.close();
                renderAll();
                toast(t("toast.deleted"));
            } catch (e) {
                if (e.status === 401) return logout();
                toast(e.message);
            }
        } else if (target.dataset.copy !== undefined) {
            try {
                await navigator.clipboard.writeText(target.dataset.copy);
                toast(t("toast.copied"), "copied");
            } catch (e) {
                toast(target.dataset.copy);
            }
        }
    });

    // ---------- Create / edit ----------
    const editForm = document.getElementById("editForm");
    const adRules = {
        title: RULES.category,
        description: RULES.description,
        // An ad that already had a deadline can keep it even if that date has passed
        deadline: value => {
            const original = state.editingId && (state.ads.find(a => a.id === state.editingId) || {}).deadline;
            return value && value === original ? null : RULES.deadline(value);
        },
        studentContact: contactRule(editForm, "studentContact")
    };
    attachLiveValidation(editForm, () => adRules);
    const description = document.getElementById("description");
    const counter = document.getElementById("counter");

    function renderCatPicker() {
        const checked = editForm.querySelector('input[name="title"]:checked');
        document.getElementById("catPicker").innerHTML = Object.keys(CATEGORIES).map(key => `
            <label style="--c: var(--cat-${key})">
                <input type="radio" name="title" value="${key}" required ${checked && checked.value === key ? "checked" : ""}>
                ${categoryIcon(key)} ${catLabel(key)}
            </label>`).join("");
    }

    function renderEditTexts() {
        document.getElementById("editTitle").textContent = t(state.editingId ? "edit.edit" : "edit.new");
        document.getElementById("saveBtn").textContent = t(state.editingId ? "edit.save" : "edit.publish");
    }

    description.addEventListener("input", () => counter.textContent = description.value.length + " / 200");

    document.addEventListener("click", event => {
        if (event.target.closest("[data-action='create']") && state.me) openEdit(null);
        const close = event.target.closest("[data-close]");
        if (close) close.closest("dialog").close();
    });
    editDialog.addEventListener("click", event => { if (event.target === editDialog) editDialog.close(); });

    function openEdit(ad) {
        state.editingId = ad ? ad.id : null;
        editForm.reset();
        clearFieldErrors(editForm);
        document.getElementById("editError").hidden = true;
        renderEditTexts();
        document.getElementById("deadline").min = new Date().toISOString().slice(0, 10);

        const category = ad ? categoryOf(ad) : (state.category !== "ALL" ? state.category : "STARTUP");
        editForm.querySelector(`input[name="title"][value="${category}"]`).checked = true;
        description.value = ad ? ad.description || "" : "";
        document.getElementById("deadline").value = ad ? ad.deadline || "" : "";
        setContactValue(editForm, "studentContact", ad ? ad.studentContact : state.me.contact);
        counter.textContent = description.value.length + " / 200";
        editDialog.showModal();
        description.focus();
    }

    editForm.addEventListener("submit", async event => {
        event.preventDefault();
        const errorBox = document.getElementById("editError");
        errorBox.hidden = true;
        if (!validateFields(editForm, adRules)) return;
        const data = Object.fromEntries(new FormData(editForm));

        const body = {
            title: data.title,
            description: data.description.trim(),
            deadline: data.deadline || null,
            studentContact: contactValue(editForm, "studentContact")
        };
        const saveBtn = document.getElementById("saveBtn");
        saveBtn.disabled = true;
        try {
            if (state.editingId) {
                const updated = await api("/api/ads/" + state.editingId, { method: "PUT", body });
                state.ads = state.ads.map(a => a.id === updated.id ? updated : a);
                toast(t("toast.updated"), "updated");
            } else {
                const created = await api("/api/ads", { method: "POST", body });
                state.ads.push(created);
                toast(t("toast.published"), "published");
            }
            editDialog.close();
            renderAll();
        } catch (e) {
            if (e.status === 401) return logout();
            errorBox.textContent = e.message;
            errorBox.hidden = false;
        } finally {
            saveBtn.disabled = false;
        }
    });

    // ---------- Toast ----------
    let toastTimer;
    // memeSlot adds a small meme picture in front of the text
    function toast(message, memeSlot) {
        const el = document.getElementById("toast");
        const meme = memeSlot && MEMES[memeSlot];
        el.innerHTML = (meme ? `<img src="/img/memes/${meme.file}" alt="" onerror="this.remove()">` : "")
            + `<span>${escapeHtml(message)}</span>`;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    // ---------- Language ----------
    onLangChange(() => {
        renderCatPicker();
        renderEditTexts();
        if (!state.me) return;
        renderAll();
        if (viewDialog.open) openView(state.viewingId);
    });
    renderMemes();
    initContactFields();
    initMemeDays();
    initLangSwitch();
    renderCatPicker();

    load();
</script>
</body>
</html>
