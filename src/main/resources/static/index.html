<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CofounderLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth">
    <aside class="auth-side">
        <svg class="rosette" viewBox="-100 -100 200 200" fill="none" stroke="#fff" stroke-width="2.5" aria-hidden="true">
            <circle r="46" cy="-46"/><circle r="46" cx="32.5" cy="-32.5"/><circle r="46" cx="46"/><circle r="46" cx="32.5" cy="32.5"/>
            <circle r="46" cy="46"/><circle r="46" cx="-32.5" cy="32.5"/><circle r="46" cx="-46"/><circle r="46" cx="-32.5" cy="-32.5"/>
            <circle r="10"/>
        </svg>
        <a class="brand" href="/">
            <span class="brand-mark">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="16.5" cy="9.5" r="2.8"/><path d="M3 20c.7-3.6 3.2-5.5 6-5.5s5.3 1.9 6 5.5M15 14.6c2.6-.3 5 1.3 5.8 4.4"/></svg>
            </span>
            <span class="brand-name">CofounderLab<small data-i18n="brand.students"></small></span>
        </a>
        <div>
            <h1 data-i18n-html="auth.heading"></h1>
            <p data-i18n="auth.lead"></p>
            <div class="auth-cats" id="authCats"></div>
        </div>
        <div class="side-meme" data-meme="login"></div>
        <p class="auth-foot" data-i18n="auth.foot"></p>
    </aside>

    <main class="auth-main">
        <div class="lang-switch auth-lang"></div>
        <div class="auth-card">
            <div class="edge-cat" data-meme="peek" aria-hidden="true"></div>
            <div class="peek-cat" id="peekCat" aria-live="polite"></div>
            <h2 id="formTitle"></h2>
            <p class="sub" id="formSub"></p>

            <div class="tabs" role="tablist">
                <button type="button" class="active" data-mode="login" role="tab" data-i18n="auth.signIn"></button>
                <button type="button" data-mode="register" role="tab" data-i18n="auth.register"></button>
            </div>

            <form class="form" id="authForm" novalidate>
                <div class="field"><label for="login" data-i18n="f.login"></label><input id="login" name="login" required maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false"><small class="hint" data-register-only hidden data-i18n="v.hint.login"></small></div>
                <div class="field"><label for="password" data-i18n="f.password"></label><input id="password" name="password" type="password" required maxlength="64" autocomplete="current-password"><small class="hint" data-register-only hidden data-i18n="v.hint.password"></small></div>

                <div class="form" data-register-only hidden>
                    <div class="row">
                        <div class="field"><label for="name" data-i18n="f.name"></label><input id="name" name="name" maxlength="30" autocomplete="given-name"></div>
                        <div class="field"><label for="surname" data-i18n="f.surname"></label><input id="surname" name="surname" maxlength="30" autocomplete="family-name"></div>
                    </div>
                    <div class="row">
                        <div class="field"><label for="department" data-i18n="f.department"></label><input id="department" name="department" maxlength="50" data-i18n-placeholder="f.departmentPh"></div>
                        <div class="field">
                            <label for="year" data-i18n="f.year"></label>
                            <select id="year" name="year" data-year-select>
                                <option value="1"></option>
                                <option value="2"></option>
                                <option value="3"></option>
                                <option value="4"></option>
                            </select>
                        </div>
                    </div>
                    <div class="field" data-contact-field>
                        <label for="contact" data-i18n="f.contact"></label>
                        <input id="contact" name="contact">
                    </div>
                </div>

                <div class="alert" id="error" hidden></div>
                <button class="btn btn-sun btn-block" type="submit" id="submitBtn"></button>
            </form>
        </div>
    </main>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/cats.js"></script>
<script src="/js/validate.js"></script>
<script src="/js/api.js"></script>
<script>
    if (getToken()) location.replace("/home.html");

    const form = document.getElementById("authForm");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");
    let mode = "login";

    // Signing in only needs both fields filled; the format rules apply when the account is created
    const loginRules = { login: RULES.required, password: RULES.required };
    const registerRules = {
        login: RULES.login,
        password: RULES.password,
        name: RULES.personName,
        surname: RULES.personName,
        department: RULES.department,
        year: RULES.year,
        contact: contactRule(form, "contact")
    };
    const currentRules = () => mode === "login" ? loginRules : registerRules;
    attachLiveValidation(form, currentRules);

    function renderTexts() {
        document.title = t("auth.pageTitle");
        document.getElementById("authCats").innerHTML = Object.keys(CATEGORIES)
            .map(key => `<span>${categoryIcon(key, 15)} ${catLabel(key)}</span>`).join("");
        document.getElementById("formTitle").textContent = t(mode === "login" ? "auth.welcome" : "auth.createTitle");
        document.getElementById("formSub").textContent = t(mode === "login" ? "auth.loginSub" : "auth.registerSub");
        submitBtn.textContent = t(mode === "login" ? "auth.signIn" : "auth.createBtn");
    }

    document.querySelectorAll(".tabs button").forEach(tab => tab.addEventListener("click", () => {
        mode = tab.dataset.mode;
        document.querySelectorAll(".tabs button").forEach(other => other.classList.toggle("active", other === tab));
        document.querySelectorAll("[data-register-only]").forEach(el => el.hidden = mode !== "register");
        document.getElementById("password").autocomplete = mode === "login" ? "current-password" : "new-password";
        errorBox.hidden = true;
        clearFieldErrors(form);
        resetPeek();
        renderTexts();
    }));

    form.addEventListener("submit", async event => {
        event.preventDefault();
        errorBox.hidden = true;
        if (!validateFields(form, currentRules())) return;
        const data = Object.fromEntries(new FormData(form));

        // Logins are case-insensitive, the backend stores them in lower case
        const body = { login: data.login.trim().toLowerCase(), password: data.password };
        if (mode === "register") {
            Object.assign(body, {
                name: data.name.trim(),
                surname: data.surname.trim(),
                department: data.department.trim(),
                year: Number(data.year),
                contact: contactValue(form, "contact")
            });
        }

        submitBtn.disabled = true;
        try {
            const result = await api("/api/auth/" + mode, { method: "POST", body });
            setToken(result.token);
            location.replace("/home.html");
        } catch (e) {
            // Registration problems with the ID belong under the ID field
            // A taken login belongs under the login field
            if (mode === "register" && e.status === 409) {
                setFieldError(form, "login", "v.loginTaken");
                setPeek("suspicious");
                document.getElementById("login").focus();
            } else {
                showError(e.message, e.status);
            }
        } finally {
            submitBtn.disabled = false;
        }
    });

    function showError(message, status) {
        errorBox.textContent = message;
        errorBox.hidden = false;
        if (status === 401) setPeek("wrongPassword");
        // Anything that is not a wrong password or bad input means the server or network failed
        else if (status !== 400) setPeek("broken");
    }

    // The meme above the form reacts to what is happening
    function setPeek(slot) {
        document.getElementById("peekCat").innerHTML = slot ? memeHtml(slot, "meme-row") : "";
    }
    const resetPeek = () => setPeek(mode === "register" ? "register" : null);

    onLangChange(() => {
        errorBox.hidden = true;
        renderTexts();
    });
    renderMemes();
    initContactFields();
    resetPeek();
    initLangSwitch();
    renderTexts();
</script>
</body>
</html>
