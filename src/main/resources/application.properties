spring.application.name=CoFounderLab

spring.datasource.url=jdbc:sqlite:./data/cofounderlab.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time, so a single connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Keep "update": with SQLite, "create"/"create-drop" make the students.id column without a type,
# and new rows then get id = NULL
spring.jpa.hibernate.ddl-auto=update

# Secret comes from the JWT_SECRET env variable or from secrets.properties (not in git)
spring.config.import=optional:file:./secrets.properties
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
